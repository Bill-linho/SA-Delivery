name: Relatar um bug
description: Informe um erro encontrado no sistema
title: "[BUG] "
labels: ["bug"]
assignees: []

body:
  - type: textarea
    id: descricao
    attributes:
      label: Descrição do bug
      description: Descreva o erro encontrado.
      placeholder: O que aconteceu?
    validations:
      required: true

  - type: textarea
    id: reproducao
    attributes:
      label: Como reproduzir?
      description: Informe os passos para reproduzir o erro.
      placeholder: |
        1. Acesse...
        2. Clique em...
        3. Observe o erro.
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Comportamento esperado
      description: O que deveria acontecer?
    validations:
      required: true

  - type: textarea
    id: atual
    attributes:
      label: Comportamento atual
      description: O que acontece atualmente?
    validations:
      required: true

  - type: textarea
    id: adicionais
    attributes:
      label: Informações adicionais
      description: Adicione prints ou outras informações relevantes.
    validations:
      required: false